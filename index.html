<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- EXTREME CACHE BUSTING - Prevent ALL caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- App Version -->
    <meta name="app-version" content="2.1.3" />
    <meta name="build-timestamp" content="2025-03-13T16:00:00Z" />
    <meta name="build-id" content="v2.1.3-build-213" />
    
    <!-- Permissions Policy for Geolocation - Allow all origins for iframe compatibility -->
    <meta http-equiv="Permissions-Policy" content="geolocation=*" />
    
    <!-- DNS Prefetch & Preconnect for faster API calls -->
    <link rel="dns-prefetch" href="https://supabase.co" />
    <link rel="preconnect" href="https://supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Connect with restaurants and hotels. Discover nearby dining, daily specials, and entertainment options in real-time." />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MYVIBES" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- Microsoft -->
    <meta name="msapplication-TileColor" content="#06b6d4" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    
    <title>MYVIBES</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration - DISABLED AUTO-UPDATE to prevent reload loops -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js?v=2.1.3')
            .then(registration => {
              console.log('✅ [PWA] Service Worker registered v2.1.3:', registration.scope);
              // Auto-update DISABLED to prevent reload loops
              // Manual updates can be triggered from debug panel if needed
            })
            .catch(error => {
              console.error('❌ [PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
