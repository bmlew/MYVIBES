<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    
    <!-- Permissions Policy for Geolocation -->
    <meta http-equiv="Permissions-Policy" content="geolocation=*" />
    
    <!-- DNS Prefetch & Preconnect for faster API calls -->
    <link rel="dns-prefetch" href="https://supabase.co" />
    <link rel="preconnect" href="https://supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    
    <!-- PWA Meta Tags - Customer App Only -->
    <meta name="description" content="Discover the best restaurants, bars, and events near you. Get exclusive deals, earn loyalty points, and find your next vibe." />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MYVIBES" />
    
    <!-- Mobile Optimization -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    
    <!-- PWA Manifest - Customer Specific -->
    <link rel="manifest" href="/manifest-customer.json" />
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-192x192.png" />
    
    <!-- Microsoft -->
    <meta name="msapplication-TileColor" content="#06b6d4" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    
    <!-- SEO -->
    <meta name="keywords" content="restaurants, bars, events, nightlife, dining, food, entertainment, loyalty, rewards, south africa" />
    <meta name="author" content="MYVIBES" />
    
    <!-- Social Media Meta Tags -->
    <meta property="og:title" content="MYVIBES - Find Your Next Vibe" />
    <meta property="og:description" content="Discover restaurants, bars, and events. Earn loyalty points and get exclusive deals." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icons/icon-512x512.png" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="MYVIBES - Find Your Next Vibe" />
    <meta name="twitter:description" content="Discover restaurants, bars, and events. Earn loyalty points and get exclusive deals." />
    <meta name="twitter:image" content="/icons/icon-512x512.png" />
    
    <title>MYVIBES - Find Your Next Vibe</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-customer.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('✅ Service Worker registered:', registration.scope);
              
              // Check for updates
              registration.addEventListener('updatefound', () => {
                console.log('🔄 New version available!');
              });
            })
            .catch(error => {
              console.error('❌ Service Worker registration failed:', error);
            });
        });
      }
      
      // Prevent pull-to-refresh on mobile
      document.body.style.overscrollBehavior = 'none';
    </script>
  </body>
</html>
